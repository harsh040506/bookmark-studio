<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow this site? · Bookmark Studio</title>
    <script src="theme-init.js"></script>
    <style>
      :root { --paper: #faf9f5; --ink: #1f1e1d; --text-2: #52514e; --text-3: #898781; --popover: #ffffff;
              --ring: 0 0 0 1px rgba(11,11,11,.1); --primary: #0b0b0b; --on-primary: #faf9f5; --code-bg: #f3f1ec;
              --focus: 0 0 0 2px var(--paper), 0 0 0 4px #2a78d6; color-scheme: light; }
      :root[data-theme="dark"] { --paper: #0b0b0b; --ink: #f0efec; --text-2: #c3c2b7; --popover: #20201f;
              --ring: inset 0 0 0 1px rgba(255,255,255,.1); --primary: #f0efec; --on-primary: #0b0b0b; --code-bg: rgba(255,255,255,.1);
              color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
             background: var(--paper); color: var(--ink);
             font: 14px/1.5 "DM Sans Variable", "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
      h1 { margin: 0; font: 400 22px/1.3 "Newsreader Variable", "Newsreader", ui-serif, Georgia, serif; }
      p { margin: 0; color: var(--text-2); }
      code { font: 13px "JetBrains Mono Variable", ui-monospace, Menlo, Consolas, monospace; background: var(--code-bg);
             padding: 2px 6px; border-radius: 4px; word-break: break-all; color: var(--ink); }
      .note { font-size: 12.5px; color: var(--text-3); }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; font: 500 13.5px inherit; font-family: inherit; cursor: pointer; }
      button:focus-visible { outline: none; box-shadow: var(--focus); }
      .ghost { background: transparent; color: var(--ink); box-shadow: var(--ring); }
      .primary { background: var(--primary); color: var(--on-primary); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Allow this site to use Bookmark Studio?</h1>
      <p id="body">
        <code id="origin">…</code> wants to use the extension to read pages, check links, take previews and
        sync your browser's bookmarks.
      </p>
      <p class="note" id="note">Only allow it if this is Bookmark Studio running on your own computer. You can change this later from the same site's Settings → Connections.</p>
      <div class="actions">
        <button type="button" class="ghost" id="deny">Don't allow</button>
        <button type="button" class="primary" id="allow">Allow</button>
      </div>
    </main>
    <script src="approve.js"></script>
  </body>
</html>
