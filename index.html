<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bookmark Studio</title>
    <meta
      name="description"
      content="Import bookmarks from any browser or service, search them properly, find dead links and duplicates, and see every page at a glance. Free, open source, no account." />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="bookmark-studio" content="app" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- site:head -->
    <!-- Sets data-theme before the first paint so there is no flash. A separate file keeps the
         extension's content security policy free of inline scripts. -->
    <script src="theme-init.js"></script>
  </head>
  <body>
    <!-- The website build (scripts/build-site.mjs) fills these in: search and social tags above,
         and a text shell here that shows while the app starts. The extension keeps them empty. -->
    <div id="root"><!-- site:shell --></div>
    <!-- site:noscript -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
