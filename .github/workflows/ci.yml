name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build website, extension and server
        run: npm run build
      - name: Check the public site (links, tags, sitemap, budgets)
        run: npm run check:site
      - uses: actions/upload-artifact@v4
        with:
          name: bookmark-studio-extension
          path: dist/bookmark-studio-extension.zip
          retention-days: 14
